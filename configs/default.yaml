datasets:
  - name: tinystories
    source:
      type: huggingface
      path: roneneldan/TinyStories
      split: train
      text_column: text

    max_documents: 100

tokenizer: gpt2

model:
  block_size: 128
  num_layers: 6
  d_model: 384
  d_ffn: 1024
  num_heads: 4
  rms_norm_eps: 1.0e-6

training:
  batch_size: 4
  learning_rate: 3.0e-4
  weight_decay: 0.0
  num_epochs: 1
  num_workers: 0
  log_interval: 100
  max_train_samples: null

runtime:
  device: auto
  seed: 42

output:
  checkpoint: checkpoints/mini_llama.pth

generation:
  max_new_tokens: 200
  do_sample: true
  temperature: 0.8
  top_k: 50
  top_p: 0.9
